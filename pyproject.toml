[project]
name = "holochain-client"
version = "0.2.0"
description = "A Python client for the Holochain Conductor API (0.6/0.7 compatible)"
readme = "README.md"
license = { text = "CAL-1.0" }
requires-python = ">=3.10"
keywords = ["holochain", "conductor-api", "p2p", "distributed"]
authors = [
    { name = "Holochain Foundation" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "msgpack>=1.0.7",
    "websockets>=12.0,<14.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
# Rust toolchain required — must run inside `nix develop`.
# holochain_client / holo_hash deps are path-pinned to the nix store until
# compatible versions are published on crates.io.
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[tool.maturin]
features = ["python-bindings"]
python-source = "."

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
