[package]
name = "holochain-client-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "holochain_client_rs"
crate-type = ["cdylib"]

[features]
default = []
python-bindings = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", optional = true }
holochain_client = { path = "/nix/store/2kn3b3nrx22iv2b3r09skxj9f25s9dl3-source/crates/client" }
holo_hash = { path = "/nix/store/2kn3b3nrx22iv2b3r09skxj9f25s9dl3-source/crates/holo_hash" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
