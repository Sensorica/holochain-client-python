[package]
name = "holochain-client-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "holochain_client_rs"
crate-type = ["cdylib"]

[features]
default = []
python-bindings = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.22", optional = true }
holochain_client = { git = "https://github.com/holochain/holochain-client-rust" }
holo_hash = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde_json = "1"
